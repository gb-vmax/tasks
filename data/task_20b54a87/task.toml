version = "1.0"

[metadata]
source = "endless-terminals"
category = "YAML and TOML configuration editing"
complexity = "simple set of 3-4 commands"
scenario = "MLOps engineer tracking experiment artifacts"

generation_model = "claude-sonnet-4-6"
pass_at_k = {1 = 0.5000, 2 = 1.0000}

[environment]
cpus = 1
memory_mb = 2048
allow_internet = true

[verifier]
timeout_sec = 120

[agent]
timeout_sec = 600
