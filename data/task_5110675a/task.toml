version = "1.0"

[metadata]
source = "endless-terminals"
category = "Makefile authoring and task automation"
complexity = "simple single terminal command"
scenario = "backup operator testing restores"

generation_model = "gpt-4.1"
pass_at_k = {1 = 0.2500, 2 = 0.5000, 3 = 0.7500, 4 = 1.0000}

[environment]
cpus = 1
memory_mb = 2048
allow_internet = true

[verifier]
timeout_sec = 120

[agent]
timeout_sec = 600
