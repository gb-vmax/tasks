version = "1.0"

[metadata]
source = "endless-terminals"
category = "performance benchmarking"
complexity = "simple set of 3-4 commands"
scenario = "platform engineer maintaining CI/CD pipelines"

generation_model = "claude-sonnet-4-6"
pass_at_k = {1 = 0.7500, 2 = 1.0000, 3 = 1.0000, 4 = 1.0000}

[environment]
cpus = 1
memory_mb = 2048
allow_internet = true

[verifier]
timeout_sec = 120

[agent]
timeout_sec = 600
