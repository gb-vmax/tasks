version = "1.0"

[metadata]
source = "endless-terminals"
category = "file and directory management"
complexity = "simple set of 2-3 commands"
scenario = "backup administrator archiving data"

generation_model = "claude-sonnet-4-6"
pass_at_k = {1 = 1.0000, 2 = 1.0000, 3 = 1.0000, 4 = 1.0000}

[environment]
cpus = 1
memory_mb = 2048
allow_internet = true

[verifier]
timeout_sec = 120

[agent]
timeout_sec = 600
