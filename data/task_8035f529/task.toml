version = "1.0"

[metadata]
source = "endless-terminals"
category = "CSV/JSON data manipulation"
complexity = "set of 5-10 commands"
scenario = "FinOps analyst optimizing cloud costs"

generation_model = "gpt-4.1"
pass_at_k = {1 = 0.5000, 2 = 0.8333, 3 = 1.0000, 4 = 1.0000}

[environment]
cpus = 1
memory_mb = 2048
allow_internet = true

[verifier]
timeout_sec = 120

[agent]
timeout_sec = 600
